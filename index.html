<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>도덕의 숲: 다섯 대현자의 시험</title>
<!--
  ============================================================
  ▶ 실행 방법
  1) 이 코드 전체를 복사합니다. (Ctrl + A → Ctrl + C)
  2) 메모장(Windows) 또는 텍스트 편집기(Mac)를 열어 붙여넣습니다.
  3) [파일] → [다른 이름으로 저장]
     - 파일 이름: 도덕의숲.html  (확장자를 반드시 .html 로!)
     - 파일 형식: 모든 파일(*.*)  /  인코딩: UTF-8
  4) 저장한 파일을 더블클릭하면 크롬·엣지 등 브라우저에서 게임이 실행됩니다.
  ※ 모든 그림은 코드(SVG)로 직접 그렸기 때문에 이미지 파일이 필요 없습니다.
  ※ 교과서 174~175쪽(도덕적 고려 대상의 확장)을 펼쳐 놓고 플레이하세요.
  ※ 등장 학자들은 실존 인물을 바탕으로 한 판타지 캐릭터이며,
     대사는 각 학자의 사상을 바탕으로 재구성한 것입니다.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#4e3a32; --ink-soft:#8a7268; --rose:#b76e79; --rose-d:#8f4c57; --gold:#e3b75a;
  --rg:linear-gradient(135deg,#f8d6bf 0%,#b76e79 30%,#fbe6c8 52%,#c4837a 76%,#f3c9a8 100%);
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
  --npc:#b76e79;
}
html,body{height:100%;overflow:hidden;background:#1d1424}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;cursor:pointer}
#game{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#2a1f33}
.hidden{display:none !important}

/* ---------- 배경 ---------- */
#bgLayer{position:absolute;inset:-12px;z-index:0;transition:opacity .6s}
#bgLayer svg{width:100%;height:100%;display:block;filter:blur(1.2px) saturate(1.05)}
#bgLayer.fade{opacity:0}
#vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(40,20,40,.35) 100%)}
#petals{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;opacity:.75;animation:petalFall linear infinite;color:#f6b3c8}
.spark{position:absolute;bottom:-10px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff6c9 40%,rgba(255,240,180,0) 70%);animation:floatUp linear infinite;opacity:0}

/* ---------- 스프라이트 ---------- */
#sprites{position:absolute;left:0;right:0;bottom:0;top:56px;z-index:3;pointer-events:none}
.sprite{position:absolute;bottom:0;height:96%;aspect-ratio:400/560;transform:translateX(-50%);transition:left .55s cubic-bezier(.3,1,.4,1),filter .35s,opacity .4s;filter:drop-shadow(0 10px 24px rgba(40,10,40,.35))}
.sprite .inner{width:100%;height:100%;animation:breath 4.5s ease-in-out infinite;transform-origin:50% 100%}
.sprite svg{width:100%;height:100%;display:block}
#sprites.crowd .sprite{height:76%}
.sprite.dim{filter:brightness(.62) saturate(.8) drop-shadow(0 10px 24px rgba(40,10,40,.3))}
.sprite.enter{animation:spriteIn .6s cubic-bezier(.2,1,.4,1)}
.sprite.leave{opacity:0}
.sprite.shake .inner{animation:angryShake .1s linear 6}
.sprite.hop .inner{animation:hop .5s ease}


/* ---------- 학자 일러스트(이미지) ---------- */
.sageImg{position:relative;width:100%;height:100%;background-repeat:no-repeat;background-size:cover;display:block}
.sageImg.mood-sad{filter:saturate(.72) brightness(.95)}
.sageImg.mood-serious{filter:contrast(1.06) saturate(1.12)}
.sageImg.mood-serious::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 45%,rgba(190,20,50,.28));pointer-events:none}
.sageImg.mood-smile::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,240,250,.18),transparent 60%);pointer-events:none}
.sprite .inner{position:relative}
.sprite .sageImg{-webkit-mask-image:radial-gradient(ellipse 50% 54% at 50% 48%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 50% 54% at 50% 48%,#000 60%,transparent 100%)}
.cv .sageImg{-webkit-mask-image:radial-gradient(ellipse 50% 52% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 50% 52% at 50% 50%,#000 58%,transparent 100%)}
.cv{position:absolute}
.moodFx{position:absolute;right:20%;top:6%;font-size:clamp(28px,4.4vw,52px);filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));animation:moodPop .45s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.moodFx.m-sad{right:24%;top:12%}
@keyframes moodPop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;width:min(1100px,calc(100% - 16px));display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:18px;border:2.5px solid transparent;
  background:linear-gradient(rgba(255,250,243,.92),rgba(255,250,243,.92)) padding-box,var(--rg) border-box;box-shadow:0 6px 18px rgba(60,20,40,.25)}
#hudChapter{font-family:var(--serif);font-weight:900;font-size:14px;color:var(--rose-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hudGroup{display:flex;align-items:center;gap:6px}
#hearts{display:flex;gap:1px;font-size:19px;line-height:1}
.heart{display:inline-block;transition:transform .2s}
.heart.lost{opacity:.4;transform:scale(.85)}
.heart.breaking{animation:heartBreak .8s ease forwards}
.chip{padding:4px 10px;border-radius:99px;background:#fff;border:2px solid #f0cfc0;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip.bump{animation:bump .5s ease}
.iconBtn{border:2px solid #f0cfc0;background:#fff;border-radius:12px;padding:4px 9px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.iconBtn:hover{background:#fff3ee}
.iconBtn:disabled{opacity:.4;cursor:default}

/* ---------- 대화창 ---------- */
#dialogWrap{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;width:min(1100px,calc(100% - 16px))}
#nameTag{position:absolute;left:28px;top:-22px;z-index:2;padding:6px 20px 6px 34px;border-radius:12px 12px 12px 2px;background:var(--npc);color:#fff;font-family:var(--serif);font-weight:900;font-size:17px;
  box-shadow:0 4px 0 rgba(0,0,0,.15),0 6px 14px rgba(0,0,0,.18);white-space:nowrap;border:2px solid rgba(255,255,255,.7);transition:background .3s}
#nameTag::before{content:'❀';position:absolute;left:12px;top:50%;transform:translateY(-52%);font-size:15px;color:#fff7d6}
#nameTag small{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:12px;opacity:.92;margin-left:7px}
#nameTag.narr{display:none}
#dialog{position:relative;display:flex;gap:14px;align-items:flex-start;min-height:146px;padding:26px 30px 28px 24px;border-radius:24px;border:4px solid transparent;cursor:pointer;
  background:radial-gradient(circle at 10% 15%,rgba(222,190,140,.16) 0,transparent 35%) padding-box,linear-gradient(180deg,rgba(255,251,244,.97),rgba(251,238,214,.97)) padding-box,var(--rg) border-box;
  box-shadow:0 12px 34px rgba(50,20,40,.35),inset 0 0 0 2px rgba(255,255,255,.7)}
#dialog.narr{background:linear-gradient(180deg,rgba(40,28,52,.9),rgba(30,20,40,.92)) padding-box,var(--rg) border-box;color:#f6ead8}
#dialog.narr #dialogText{font-family:var(--serif);font-style:italic;text-align:center}
.orn{position:absolute;width:34px;height:34px;pointer-events:none}
.orn.tl{left:6px;top:6px}.orn.tr{right:6px;top:6px;transform:scaleX(-1)}.orn.bl{left:6px;bottom:6px;transform:scaleY(-1)}.orn.br{right:6px;bottom:6px;transform:scale(-1,-1)}
#dAvatar{flex:0 0 auto;width:82px;height:82px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(0,0,0,.2);background:#f3e6ff}
#dAvatar svg{width:100%;height:100%;display:block}
#dAvatar.talking{animation:talk .32s ease-in-out infinite}
.dbody{flex:1;min-width:0}
#dialogText{font-size:clamp(15.5px,2vw,19.5px);line-height:1.8;font-weight:500;word-break:keep-all;min-height:3.4em;white-space:pre-wrap}
#dialogText b{color:#b0455a}
#dialog.narr #dialogText b{color:#ffd98a}
#nextArrow{position:absolute;right:26px;bottom:10px;color:var(--rose);font-size:16px;opacity:0;pointer-events:none}
#nextArrow.show{opacity:1;animation:arrowBounce .7s ease-in-out infinite}

/* ---------- 선택지 ---------- */
#choiceLayer{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:70px 16px 190px;background:rgba(40,20,50,.28)}
#choiceList{display:flex;flex-direction:column;gap:10px;width:min(680px,100%)}
.choiceQ{align-self:center;padding:6px 18px;border-radius:99px;background:rgba(255,255,255,.92);font-family:var(--serif);font-weight:900;color:var(--rose-d);font-size:15px;margin-bottom:4px;text-align:center;word-break:keep-all}
.choice{position:relative;display:flex;align-items:center;gap:12px;padding:13px 18px 13px 13px;border-radius:16px;border:3px solid transparent;text-align:left;
  background:linear-gradient(#fffaf2,#fdf0dd) padding-box,var(--rg) border-box;font-size:clamp(14px,1.8vw,16.5px);font-weight:600;color:var(--ink);line-height:1.5;word-break:keep-all;
  box-shadow:0 6px 18px rgba(60,20,40,.28);opacity:0;animation:choiceIn .35s ease forwards;transition:transform .15s,box-shadow .15s}
.choice:hover,.choice:focus-visible{transform:scale(1.02);box-shadow:0 10px 26px rgba(183,110,121,.45);outline:none}
.choice .key{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px;background:linear-gradient(135deg,#f0a7b3,#b76e79)}
.choice.used{opacity:.4 !important;filter:grayscale(.7);cursor:not-allowed;transform:none !important}
.choice.used .ct{text-decoration:line-through}
.choice.picked{animation:picked .35s ease forwards}

/* ---------- 공통 패널 ---------- */
.overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(30,15,40,.5);backdrop-filter:blur(3px);animation:fadeIn .35s ease}
.panel{position:relative;width:min(760px,100%);max-height:100%;overflow:auto;padding:24px 22px 20px;border-radius:28px;border:4px solid transparent;
  background:linear-gradient(180deg,#fffaf1,#fbeed6) padding-box,var(--rg) border-box;box-shadow:0 20px 50px rgba(30,10,30,.45);animation:popIn .45s cubic-bezier(.2,1.3,.4,1)}
.pTitle{font-family:var(--serif);font-weight:900;font-size:clamp(20px,3.4vw,26px);color:var(--rose-d);text-align:center}
.pSub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin-top:4px;word-break:keep-all}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 26px;border:none;border-radius:99px;
  background:linear-gradient(135deg,#f4b3be,#b76e79 55%,#d9a14a);color:#fff;font-size:16px;font-weight:900;box-shadow:0 5px 0 #8f4c57,0 10px 20px rgba(183,110,121,.35);transition:transform .15s,box-shadow .15s}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #8f4c57,0 14px 26px rgba(183,110,121,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f4c57}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--rose);box-shadow:0 5px 0 #e2b9b0}
.btn.ghost::after{display:none}
.btnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* ---------- 타이틀 (웹소설 표지) ---------- */
#title{position:absolute;inset:0;z-index:40;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#ffe7c4 0%,#f6b9c9 35%,#9a5f9e 70%,#3a2152 100%)}
#title .rays{position:absolute;left:50%;top:32%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,240,190,.22) 0 4deg,transparent 4deg 13deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);animation:spin 90s linear infinite}
#coverArt{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(1150px,150vw);height:74%}
.cv{position:absolute;bottom:0;transform:translateX(-50%);filter:drop-shadow(0 8px 20px rgba(40,10,40,.45))}
.cv svg{width:100%;height:100%;display:block}
#coverFrame{position:absolute;inset:10px;border:2px solid rgba(255,236,190,.85);border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 6px rgba(255,255,255,.12),inset 0 0 60px rgba(255,220,170,.35)}
#coverText{position:absolute;left:0;right:0;top:5%;text-align:center;z-index:3;padding:0 14px}
.cvTag{display:inline-block;padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.85);color:var(--rose-d);font-weight:700;font-size:12.5px;letter-spacing:.04em}
.cvTitle{margin-top:10px;font-family:var(--serif);font-weight:900;font-size:clamp(42px,8.5vw,92px);line-height:1.05;color:#fff;letter-spacing:.04em;
  text-shadow:0 2px 0 #c77f8e,0 4px 0 #9a4e60,0 0 30px rgba(255,220,160,.9),0 10px 30px rgba(60,10,40,.5)}
.cvSub{margin-top:8px;font-family:var(--serif);font-weight:700;font-size:clamp(16px,2.6vw,24px);color:#fff7e0;text-shadow:0 2px 8px rgba(60,10,40,.6);letter-spacing:.2em}
.cvSub::before,.cvSub::after{content:'✦';margin:0 12px;color:#ffe08a}
#coverBtns{position:absolute;left:0;right:0;bottom:6%;z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px}
.cvNote{font-size:12px;color:#fff;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.5);text-align:center;padding:0 16px;word-break:keep-all}

/* ---------- 이름 입력 ---------- */
#nameInput{width:100%;margin-top:14px;padding:12px 14px;border-radius:14px;border:3px solid #e8c0b4;font:inherit;font-size:20px;font-weight:700;text-align:center;color:var(--rose-d);outline:none;user-select:text}
#nameInput:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,180,184,.4)}

/* ---------- 챕터 카드 ---------- */
.chapterCard{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(60,30,70,.75),rgba(20,8,28,.95));color:#fff;animation:fadeIn .5s ease;cursor:pointer;text-align:center;padding:20px}
.ccNo{font-family:var(--serif);letter-spacing:.4em;color:#ffd98a;font-size:15px}
.ccTitle{font-family:var(--serif);font-weight:900;font-size:clamp(34px,7vw,64px);margin:6px 0;text-shadow:0 0 30px rgba(255,200,150,.7)}
.ccSub{font-size:16px;opacity:.9}
.ccFaces{display:flex;gap:14px;margin-top:20px}
.ccFaces div{width:110px;height:110px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px #e3b75a,0 0 30px rgba(255,220,160,.6);background:#f6e9ff}
.ccFaces svg{width:100%;height:100%;display:block}
.ccTip{margin-top:20px;font-size:12.5px;opacity:.75}

/* ---------- 지도 ---------- */
#mapLayer{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 10px 10px;background:radial-gradient(ellipse at center,#4a3360,#1d1028)}
#mapObjective{margin-bottom:8px;padding:7px 18px;border-radius:99px;background:rgba(255,250,240,.95);border:2px solid var(--gold);font-weight:700;font-size:14px;color:var(--rose-d);text-align:center;word-break:keep-all;max-width:94%}
#mapBox{position:relative;width:min(100%,calc((100dvh - 130px) * 1000 / 620));aspect-ratio:1000/620;border-radius:20px;overflow:hidden;box-shadow:0 0 0 4px #e3b75a,0 0 0 8px #fff3d6,0 20px 50px rgba(0,0,0,.5)}
#mapBox > svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;padding:0}
.node .nIco{width:clamp(38px,6vw,62px);height:clamp(38px,6vw,62px);border-radius:50%;display:grid;place-items:center;font-size:clamp(20px,3.2vw,32px);background:radial-gradient(circle at 35% 30%,#fff,#ffe8c8);border:3px solid #e3b75a;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.node .nLbl{padding:2px 9px;border-radius:99px;background:rgba(255,250,240,.95);font-size:clamp(10.5px,1.4vw,13px);font-weight:900;color:var(--ink);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.node.avail .nIco{animation:nodePulse 1.4s ease-in-out infinite}
.node.boss .nIco{border-color:#ff8fab;background:radial-gradient(circle at 35% 30%,#fff,#ffd6e4)}
.node.done .nIco{filter:grayscale(.3) brightness(.95)}
.node.done .nIco::after{content:'✔';position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:#4fb48b;color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}
.node.locked{filter:grayscale(1) brightness(.75);cursor:not-allowed}
.node.locked .nIco::after{content:'🔒';position:absolute;right:-6px;top:-6px;font-size:15px}
.node .nIco{position:relative}
#token{position:absolute;width:clamp(34px,5vw,52px);height:clamp(34px,5vw,52px);transform:translate(-50%,-115%);transition:left 1s ease-in-out,top 1s ease-in-out;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));pointer-events:none}
#token svg{width:100%;height:100%}
.fog{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(230,224,240,.92) 0%,rgba(200,190,220,.85) 50%,rgba(200,190,220,0) 72%);display:grid;place-items:center;pointer-events:none}
.fog span{font-weight:900;font-size:clamp(11px,1.5vw,14px);color:#5a4a6e;background:rgba(255,255,255,.85);padding:3px 10px;border-radius:99px;text-align:center}

/* ---------- 사례 관람 ---------- */
.casePanel{width:min(980px,100%);display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:20px}
.caseStage{position:relative;border-radius:18px;overflow:hidden;min-height:330px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.18)}
.caseStage .it{position:absolute;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.caseStage .lbl{position:absolute;left:10px;top:10px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.9);font-size:12px;font-weight:900;color:var(--rose-d)}
.spot{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle,#ffe27a,#ff9fb5);color:#7a2f43;font-weight:900;font-size:18px;
  box-shadow:0 0 0 0 rgba(255,220,120,.8);animation:spotPulse 1.3s ease-out infinite;z-index:3}
.spot.found{animation:none;background:#4fb48b;color:#fff}
.caseInfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.caseReal{display:inline-block;align-self:flex-start;padding:3px 12px;border-radius:99px;background:#fff;border:2px solid var(--rose);color:var(--rose-d);font-size:12.5px;font-weight:900}
.caseTitle{font-family:var(--serif);font-weight:900;font-size:clamp(20px,2.8vw,26px);color:var(--ink)}
.caseDesc{font-size:14.5px;line-height:1.65;word-break:keep-all}
.caseCount{font-size:13px;font-weight:900;color:var(--rose)}
.notes{display:flex;flex-direction:column;gap:7px}
.note{padding:9px 12px;border-radius:12px;background:#fff;border:2px solid #f3dccf;font-size:13.5px;line-height:1.6;word-break:keep-all;animation:popIn .4s cubic-bezier(.2,1.4,.4,1)}
.note b{color:var(--rose-d)}
.note.ghost{background:rgba(255,255,255,.45);border-style:dashed;color:#b7a69c;animation:none}
.cage{position:absolute;inset:14% 8% 26% 8%;background-image:linear-gradient(90deg,rgba(80,80,90,.7) 2px,transparent 2px),linear-gradient(rgba(80,80,90,.7) 2px,transparent 2px);background-size:16.6% 33.3%;border:3px solid rgba(80,80,90,.8)}

/* ---------- 분류 게임 ---------- */
.sortCard{margin:16px auto 6px;max-width:560px;padding:20px 18px;border-radius:18px;background:#fff;border:3px solid #f0cfc0;box-shadow:0 8px 20px rgba(0,0,0,.12);font-size:clamp(16px,2.2vw,19px);font-weight:700;line-height:1.6;text-align:center;word-break:keep-all;animation:popIn .35s ease}
.sortCard.ok{border-color:#4fb48b;background:#effaf4}
.sortCard.no{border-color:#e0384f;animation:shakeS .4s ease}
.sortWhy{min-height:46px;max-width:560px;margin:8px auto 0;font-size:14px;line-height:1.6;text-align:center;word-break:keep-all;color:var(--ink)}
.bins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.bin{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;padding:10px 14px;border-radius:18px;border:3px solid transparent;background:linear-gradient(#fffaf2,#fdf0dd) padding-box,var(--rg) border-box;box-shadow:0 5px 14px rgba(0,0,0,.15);font-weight:900;font-size:15px;color:var(--ink);transition:transform .15s}
.bin:hover{transform:translateY(-3px)}
.bin:disabled{opacity:.5;transform:none;cursor:default}
.bin .bf{width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--gold);background:#f6e9ff;display:grid;place-items:center;font-size:32px}
.bin .bf svg{width:100%;height:100%;display:block}
.bin small{font-weight:500;font-size:11.5px;color:var(--ink-soft)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#ead6cc}
.dots i.ok{background:#4fb48b}.dots i.no{background:#e0384f}.dots i.cur{background:var(--rose);transform:scale(1.3)}

/* ---------- 시험(빈칸) ---------- */
.trialPanel{width:min(900px,100%);padding:0;overflow:hidden;display:grid;grid-template-columns:240px 1fr}
.tLeft{padding:22px 16px;background:linear-gradient(180deg,#5a3a6e,#2e1d40);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tFace{width:150px;height:150px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(255,220,160,.5);background:#f6e9ff}
.tFace svg{width:100%;height:100%;display:block}
.tName{font-family:var(--serif);font-weight:900;font-size:18px}
.tBook{font-size:12.5px;opacity:.85;line-height:1.5;word-break:keep-all}
.tRight{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tQno{font-family:var(--serif);font-weight:900;color:var(--rose-d);font-size:18px}
.tTimer{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.tTrack{flex:1;height:14px;border-radius:99px;background:#f2e4d4;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.tFill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#a6e6bc,#62c993)}
.tFill.warn{background:linear-gradient(90deg,#ffe594,#ffb85c)}
.tFill.danger{background:linear-gradient(90deg,#ff9a9a,#ff3d62);animation:dangerBlink .5s ease-in-out infinite alternate}
.tSec{font-weight:900;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.tSec.danger{color:#e0384f;animation:dangerText .5s ease-in-out infinite alternate}
.tSentence{padding:18px 16px;border-radius:16px;background:#fff;border:2px solid #f3dccf;font-size:clamp(16px,2.2vw,19.5px);line-height:2;word-break:keep-all;font-family:var(--serif);font-weight:600}
.blank{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin:0 4px;white-space:nowrap;font-family:'Noto Sans KR',sans-serif}
#answerInput{width:7.5em;max-width:44vw;padding:4px 10px;border-radius:12px;border:3px dashed #d79aa2;background:#fffaf6;font:inherit;font-size:.95em;font-weight:700;color:#8a3d4b;text-align:center;outline:none;user-select:text}
#answerInput:focus{border-style:solid;border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,180,184,.45)}
#answerInput.wrong{animation:shakeS .4s ease;border-color:#e0384f}
#answerInput.correct{border-style:solid;border-color:#4fb48b;color:#2d8a62;background:#effaf4}
.okBtn{padding:6px 14px;border:none;border-radius:12px;background:linear-gradient(135deg,#f0a7b3,#b76e79);color:#fff;font-weight:900;font-size:.85em;box-shadow:0 3px 0 #94505b}
.okBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #94505b}
.tClue{padding:9px 13px;border-radius:12px;background:#fff4d6;border:2px solid #f2d18b;font-size:14px;line-height:1.6;word-break:keep-all}
.tHint{padding:9px 13px;border-radius:12px;background:#ffe9ee;border:2px solid #f3b6c3;font-size:14px;line-height:1.6;word-break:keep-all;animation:popIn .35s ease}
.hintCode{display:inline-block;margin:0 6px;padding:1px 10px;border-radius:8px;background:#fff;color:var(--rose);font-weight:900;letter-spacing:.12em;font-size:1.1em}
.tFoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);gap:8px;flex-wrap:wrap}

/* ---------- 순서 맞추기 ---------- */
.orderSlots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:150px;min-height:74px;border-radius:14px;border:3px dashed #e2c2b6;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:700;padding:6px;color:#c4a99d;background:rgba(255,255,255,.5)}
.slot.fill{border-style:solid;border-color:#4fb48b;color:var(--ink);background:#effaf4;animation:popIn .3s ease}
.orderCards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.oCard{width:150px;padding:10px 8px;border-radius:14px;border:3px solid #f0cfc0;background:#fff;font-weight:900;font-size:14px;line-height:1.4;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.oCard small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-soft)}
.oCard .oi{font-size:26px}
.oCard.gone{visibility:hidden}
.oCard.no{animation:shakeS .4s ease;border-color:#e0384f}

/* ---------- 도감 ---------- */
.codexPanel{width:min(900px,100%);height:min(640px,100%);display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0}
.tab{padding:7px 14px;border-radius:99px;border:2px solid #f0cfc0;background:#fff;font-weight:900;font-size:13.5px;color:var(--ink)}
.tab.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.codexBody{flex:1;overflow:auto;padding:4px}
.prof{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:10px;border-radius:16px;background:#fff;border:2px solid #f3dccf;margin-bottom:8px}
.prof .pf{width:110px;height:110px;border-radius:14px;overflow:hidden;background:linear-gradient(#fbeaff,#d8c4f2)}
.prof .pf svg{width:100%;height:100%;display:block}
.prof h4{font-family:var(--serif);font-size:17px;color:var(--rose-d)}
.prof p{font-size:13px;line-height:1.6;word-break:keep-all;margin-top:3px}
.tbar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:900;color:var(--rose)}
.tbar .tb{flex:1;height:10px;border-radius:99px;background:#f2e4d4;overflow:hidden}
.tbar .tb i{display:block;height:100%;background:linear-gradient(90deg,#ffb3c7,#e86a8c);border-radius:99px;transition:width .6s}
.cItem{padding:10px 12px;border-radius:14px;background:#fff;border:2px solid #f3dccf;margin-bottom:8px;font-size:13.5px;line-height:1.6;word-break:keep-all}
.cItem h5{font-size:15px;color:var(--rose-d);margin-bottom:2px}
.cItem.lock{opacity:.5;border-style:dashed}

/* ---------- 신뢰도 토스트 ---------- */
#toasts{position:absolute;right:12px;top:66px;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;background:rgba(255,250,243,.96);border:2px solid #f3b6c3;box-shadow:0 6px 16px rgba(0,0,0,.2);font-weight:900;font-size:13.5px;animation:toastIn .4s cubic-bezier(.2,1.4,.4,1),toastOut .4s ease 2.2s forwards}
.toast .tf{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#f6e9ff;border:2px solid #fff;box-shadow:0 0 0 2px var(--gold)}
.toast .tf svg{width:100%;height:100%;display:block}
.toast.up{color:#d6336c}.toast.down{color:#5a6b8a;border-color:#b8c4dc}
.toast.star{color:#a87400;border-color:#ffd66e}

/* ---------- 엔딩 ---------- */
.endPanel{width:min(860px,100%);text-align:center}
.endCG{position:relative;height:300px;margin:6px -6px 10px;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#fff2d8,#f6b9c9 50%,#7a4a8e)}
.endCG .cv{height:96%}
.endTitle{display:inline-block;margin:8px 0;padding:10px 22px;border-radius:18px;background:linear-gradient(135deg,#fff3c4,#ffd36e 50%,#f4b3be);color:#7a4a12;font-family:var(--serif);font-size:clamp(17px,3.4vw,22px);font-weight:900;box-shadow:0 4px 0 #d6a24a,0 0 26px rgba(255,210,100,.7);animation:glow 2s ease-in-out infinite alternate}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:#fff;border-radius:14px;padding:8px 4px;border:2px solid #f3dccf}
.stats b{display:block;font-size:19px;color:var(--rose)}
.stats span{font-size:12px;color:var(--ink-soft)}
.chain{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:10px 0}
.chain .nd{background:#fff;border:2px solid var(--rose-l,#e8b4b8);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;line-height:1.35}
.chain .nd small{display:block;font-weight:500;color:var(--ink-soft);font-size:11px}
.chain .ar{color:var(--rose);font-weight:900}

/* ---------- 게임오버 ---------- */
.overPanel{width:min(560px,100%);text-align:center}
.overTitle{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,40px);color:#c25d70;letter-spacing:.05em}
.quoteBox{display:flex;gap:14px;align-items:center;text-align:left;margin:14px 0;padding:12px;border-radius:18px;background:#fff;border:2px dashed #e8b4b8}
.quoteBox .qf{flex:0 0 auto;width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px var(--gold);background:#f6e9ff}
.quoteBox .qf svg{width:100%;height:100%;display:block}
.quoteBox p{line-height:1.6;word-break:keep-all;font-size:14.5px}

/* ---------- 효과 ---------- */
#flash{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:0}
#flash.red{animation:flashRed .6s ease}
#flash.soft{animation:flashSoft 1.6s ease}
#flash.white{animation:flashWhite .8s ease}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.particle{position:absolute;font-size:var(--s);color:var(--c);text-shadow:0 0 8px #fff,0 0 14px var(--c);animation:burst var(--d) ease-out forwards}
.floatPts{position:fixed;z-index:95;font-weight:900;color:#c48a00;text-shadow:0 2px 0 #fff;animation:floatPts 1.2s ease-out forwards;pointer-events:none;white-space:nowrap}
.floatPts.minus{color:#d6334f}
.confetti{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
.twk{animation:twinkle 2s ease-in-out infinite}

@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.7}100%{transform:translateY(-105vh) translateX(-10px);opacity:0}}
@keyframes petalFall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) translateX(80px) rotate(560deg)}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.008,1.014)}}
@keyframes spriteIn{0%{opacity:0;transform:translateX(-50%) translateY(30px)}100%{opacity:1;transform:translateX(-50%)}}
@keyframes angryShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-1deg)}75%{transform:translateX(7px) rotate(1deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes choiceIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes picked{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(255,214,110,.75)}100%{transform:scale(1)}}
@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes arrowBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes dangerBlink{from{opacity:1}to{opacity:.45;box-shadow:0 0 12px rgba(255,61,98,.9)}}
@keyframes dangerText{from{opacity:1;transform:scale(1)}to{opacity:.55;transform:scale(1.12)}}
@keyframes heartBreak{0%{transform:scale(1)}20%{transform:scale(1.5) rotate(-12deg)}40%{opacity:.2}60%{opacity:1}80%{opacity:.2}100%{opacity:.4;transform:scale(.85)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18);background:#fff6cf}}
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-12px,5px)}20%{transform:translate(11px,-6px)}30%{transform:translate(-9px,7px)}40%{transform:translate(9px,-4px)}50%{transform:translate(-7px,3px)}60%{transform:translate(6px,-3px)}70%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes shakeS{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes flashRed{0%{opacity:0}20%{opacity:1;background:rgba(255,70,90,.3)}100%{opacity:0;background:rgba(255,70,90,0)}}
@keyframes flashSoft{0%{opacity:0}30%{opacity:1;background:rgba(170,190,230,.35)}100%{opacity:0}}
@keyframes flashWhite{0%{opacity:0}25%{opacity:1;background:rgba(255,255,255,.85)}100%{opacity:0;background:rgba(255,255,255,0)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(var(--r));opacity:0}}
@keyframes floatPts{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-40px)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
@keyframes glow{from{box-shadow:0 4px 0 #d6a24a,0 0 14px rgba(255,210,100,.5)}to{box-shadow:0 4px 0 #d6a24a,0 0 32px rgba(255,210,100,.95)}}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,226,122,.9),0 4px 10px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 10px rgba(255,226,122,0),0 4px 10px rgba(0,0,0,.3)}}
@keyframes spotPulse{0%{box-shadow:0 0 0 0 rgba(255,226,122,.9)}100%{box-shadow:0 0 0 16px rgba(255,226,122,0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

@media (max-width:760px){
  #hud{gap:6px;padding:6px 8px;flex-wrap:wrap}
  #hudChapter{flex-basis:100%;font-size:12.5px}
  .chip{font-size:12px;padding:3px 8px}
  #hearts{font-size:16px}
  #sprites{top:84px}
  .sprite{height:80%}
  #dialog{min-height:128px;padding:22px 16px 26px 14px;gap:10px}
  #dAvatar{width:56px;height:56px}
  #nameTag{left:14px;font-size:15px}
  #nameTag small{display:none}
  .orn{width:24px;height:24px}
  .casePanel{grid-template-columns:1fr;padding:14px}
  .caseStage{min-height:230px}
  .trialPanel{grid-template-columns:1fr}
  .tLeft{flex-direction:row;padding:12px;text-align:left}
  .tFace{width:64px;height:64px;flex:0 0 auto}
  .tBook{display:none}
  .bin{min-width:110px;padding:8px}
  .bin .bf{width:48px;height:48px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .endCG{height:200px}
  .slot,.oCard{width:132px}
  .ccFaces div{width:76px;height:76px}
  #toasts{top:96px}
}
@media (max-height:620px){
  #dialog{min-height:110px;padding-top:20px}
  #dialogText{line-height:1.6}
  .caseStage{min-height:220px}
}
</style>
</head>
<body>
<div id="game">
  <div id="bgLayer"></div>
  <div id="vignette"></div>
  <div id="petals"></div>
  <div id="sprites"></div>

  <header id="hud" class="hidden">
    <div id="hudChapter">프롤로그 · 황금빛 신전</div>
    <div class="hudGroup"><div id="hearts"></div></div>
    <span class="chip" id="starChip">⭐ 0</span>
    <button class="iconBtn" id="codexBtn" title="도감">📖 도감</button>
    <button class="iconBtn" id="soundBtn" title="소리">🔊</button>
  </header>

  <div id="dialogWrap" class="hidden">
    <div id="nameTag">미네르바<small>지혜의 부엉이</small></div>
    <div id="dialog">
      <svg class="orn tl" viewBox="0 0 40 40"><path d="M3 34 Q3 3 34 3" fill="none" stroke="#d9a94e" stroke-width="2"/><path d="M9 34 Q9 9 34 9" fill="none" stroke="#efc96f" stroke-width="1.2"/><path d="M34 3 l3 3 l-3 3 l-3 -3z" fill="#e7a0ae"/><circle cx="15" cy="15" r="2.4" fill="#e7a0ae"/></svg>
      <svg class="orn tr" viewBox="0 0 40 40"><path d="M3 34 Q3 3 34 3" fill="none" stroke="#d9a94e" stroke-width="2"/><path d="M9 34 Q9 9 34 9" fill="none" stroke="#efc96f" stroke-width="1.2"/><path d="M34 3 l3 3 l-3 3 l-3 -3z" fill="#e7a0ae"/><circle cx="15" cy="15" r="2.4" fill="#e7a0ae"/></svg>
      <svg class="orn bl" viewBox="0 0 40 40"><path d="M3 34 Q3 3 34 3" fill="none" stroke="#d9a94e" stroke-width="2"/><circle cx="15" cy="15" r="2.4" fill="#e7a0ae"/></svg>
      <svg class="orn br" viewBox="0 0 40 40"><path d="M3 34 Q3 3 34 3" fill="none" stroke="#d9a94e" stroke-width="2"/><circle cx="15" cy="15" r="2.4" fill="#e7a0ae"/></svg>
      <div id="dAvatar" class="hidden"></div>
      <div class="dbody"><div id="dialogText"></div></div>
      <div id="nextArrow">▼</div>
    </div>
  </div>

  <div id="choiceLayer" class="hidden"><div id="choiceList"></div></div>
  <div id="overlays"></div>
  <div id="toasts"></div>
  <div id="flash"></div>

  <!-- 타이틀 -->
  <div id="title">
    <div class="rays"></div>
    <div id="coverArt"></div>
    <div id="coverFrame"></div>
    <div id="coverText">
      <span class="cvTag">중1 도덕 · Ⅳ. 자연과의 관계 · 도덕적 고려 대상의 확장</span>
      <div class="cvTitle">도덕의 숲</div>
      <div class="cvSub">다섯 대현자의 시험</div>
    </div>
    <div id="coverBtns">
      <button class="btn" id="startBtn">✨ 이야기 시작하기</button>
      <div class="cvNote">교과서 174~175쪽을 펼쳐 두세요 · 클릭 또는 Enter로 대화를 넘겨요<br>등장 학자들은 실존 인물을 바탕으로 한 판타지 캐릭터예요</div>
    </div>
  </div>
</div>
<div id="fx"></div>

<script>
/* =========================================================
   ART: 학자 일러스트 (선생님이 생성한 로판 웹툰 그림) + 부엉이 SVG

/* 얼굴 중심 위치(그림 가로·세로 비율) */
const FACE_AT = { singer:[.49,.35], regan:[.50,.33], taylor:[.60,.30], leopold:[.54,.34], schweitzer:[.50,.29] };
const IMG_RATIO = 1024/687;
const MOOD_FX = { serious:'💢', sad:'💧', smile:'✨', surprised:'❗' };

function drawSage(key, mood='normal', opts={}){

    const z = 2.15, zh = z*IMG_RATIO, [fx0, fy0] = FACE_AT[key];
    const px = ((.5 - fx0*z)/(1 - z))*100, py = ((.5 - fy0*zh)/(1 - zh))*100;
    return `<div class="sageImg face img-${key} mood-${mood}" style="background-size:${z*100}% auto;background-position:${px.toFixed(1)}% ${py.toFixed(1)}%"></div>`;
  }
  const pos = crop === 'bust' ? `50% ${Math.max(0, FACE_AT[key][1]*100-22).toFixed(0)}%` : '50% 0%';
  return `<div class="sageImg ${crop} img-${key} mood-${mood}" style="background-position:${pos}"></div>${fx}`;
}

  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <linearGradient id="${u}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb0ec"/><stop offset="1" stop-color="#8a64b8"/></linearGradient>

    </defs>
    ${opts.crop === 'face' ? `<rect x="0" y="0" width="200" height="220" fill="#f3e6ff"/>` : ''}
    <path d="M40 120 Q16 164 52 198 L100 208 L148 198 Q184 164 160 120Z" fill="#7a55a8"/>
    <ellipse cx="100" cy="128" rx="66" ry="74" fill="url(#${u}b)"/>

    ${[0,1,2].map(r=>[0,1,2,3].map(i=>`<path d="M${78+i*14-r*2} ${142+r*14} q6 6 12 0" stroke="#c9a6e8" stroke-width="2" fill="none"/>`).join('')).join('')}
    <path d="M44 70 L58 38 L76 66Z M156 70 L142 38 L124 66Z" fill="#8a64b8"/>
    <ellipse cx="74" cy="92" rx="28" ry="26" fill="#efe0ff"/><ellipse cx="126" cy="92" rx="28" ry="26" fill="#efe0ff"/>
    ${eyes}
    <path d="M94 108 L100 122 L106 108Z" fill="#f0a93a"/>
    <ellipse cx="62" cy="114" rx="9" ry="5" fill="#ff9ab8" opacity=".6"/><ellipse cx="138" cy="114" rx="9" ry="5" fill="#ff9ab8" opacity=".6"/>
    <path d="M70 46 Q100 30 130 46 L124 60 Q100 50 76 60Z" fill="#3a2a66"/><path d="M96 34 L100 20 L104 34Z" fill="#ffd36e"/>
    <circle cx="100" cy="40" r="4" fill="#ffd36e"/>

<script>
/* =========================================================
   ENGINE: 미연시 엔진 (대사·스프라이트·선택지·오버레이)
   ========================================================= */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const G = {
  name:'루아', hp:3, stars:0, chapter:0, pos:'temple',
  trust:{ singer:30, regan:30, schweitzer:30, taylor:30, leopold:30 },
  done:new Set(), cases:new Set(), notes:new Set(['n0']),
  wrongChoices:0, wrongQuiz:0, revives:0, stance:null
};

const PEOPLE = {
  owl:{ name:'미네르바', title:'지혜의 부엉이', color:'#8a64b8' },
  singer:{ name:'피터 싱어', title:'공리주의 기사단장', color:'#3a8fb0' },
  regan:{ name:'톰 레건', title:'원칙의 근위대장', color:'#a3324a' },
  schweitzer:{ name:'알베르트 슈바이처', title:'숲의 성스러운 의사', color:'#4c6f92' },
  taylor:{ name:'폴 테일러', title:'냉철한 학자 공작', color:'#2c3f78' },
  leopold:{ name:'알도 레오폴드', title:'대지와 밤하늘의 대공', color:'#9a6a2a' }
};
const SAGE_KEYS = ['singer','regan','schweitzer','taylor','leopold'];

/* ---------------- 사운드 ---------------- */
let actx = null, soundOn = true;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d=.12, type='sine', v=.07, delay=0, slide=null){
  if(!soundOn || !actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .05);
}
const SFX = {
  blip(){ tone(560 + Math.random()*160, .03, 'square', .014); },
  select(){ tone(660,.08,'triangle',.07); tone(990,.1,'triangle',.05,.07); },
  chime(){ [659,880,1175].forEach((f,i)=>tone(f,.28,'sine',.06,i*.09)); },
  wrong(){ tone(320,.28,'sawtooth',.05,0,140); },
  hit(){ tone(130,.35,'sawtooth',.08,0,50); },
  sad(){ [587,523,466,392].forEach((f,i)=>tone(f,.35,'sine',.05,i*.18)); },
  correct(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.08)); },
  coin(){ tone(988,.07,'square',.035); tone(1319,.16,'square',.035,.07); },
  heart(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'sine',.05,i*.06)); },
  tick(){ tone(900,.05,'square',.04); },
  over(){ [392,330,262,196].forEach((f,i)=>tone(f,.45,'triangle',.07,i*.26)); },
  step(){ tone(420,.06,'triangle',.04); tone(520,.06,'triangle',.04,.12); },
  page(){ tone(1200,.05,'sine',.03); tone(900,.08,'sine',.03,.04); },
  fanfare(){
    [[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.42],[880,.9,.15],[1047,1.05,.15],[1175,1.2,.15],[1319,1.35,.8]]
      .forEach(([f,d,l])=>{ tone(f,l,'triangle',.08,d); tone(f/2,l,'sine',.04,d); });
  }
};

/* ---------------- HUD ---------------- */
function renderHearts(){
  const h = $('hearts'); h.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('span'); s.className = 'heart' + (i < G.hp ? '' : ' lost');
    s.textContent = i < G.hp ? '❤️' : '🤍'; h.appendChild(s);
  }
}
function setChapter(t){ $('hudChapter').textContent = t; }
function bumpStar(){ const c = $('starChip'); c.textContent = `⭐ ${G.stars}`; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
function floatAt(txt, minus){
  const r = $('starChip').getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'floatPts' + (minus ? ' minus' : '');
  f.textContent = txt; f.style.left = (r.left + r.width/2 - 24) + 'px'; f.style.top = (r.bottom + 4) + 'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1300);
}
function gainStars(n){ G.stars += n; bumpStar(); floatAt(`+${n} ⭐`); SFX.coin(); }
function loseStars(n){ G.stars = Math.max(0, G.stars - n); bumpStar(); floatAt(`-${n} ⭐`, true); }
function damage(){
  if(G.hp <= 0) return; G.hp--;
  const el = $('hearts').children[G.hp];
  if(el){ el.classList.add('breaking'); el.textContent = '💔'; }
  setTimeout(renderHearts, 800);
}
function toast(html, cls=''){
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.innerHTML = html;
  $('toasts').appendChild(t); setTimeout(()=>t.remove(), 2800);
}
function trust(key, d){
  if(!d) return;
  G.trust[key] = clamp(G.trust[key] + d, 0, 100);
  toast(`<span class="tf">${drawSage(key, d > 0 ? 'smile' : 'sad', {crop:'face'})}</span>${PEOPLE[key].name} 신뢰도 ${d>0?'+':''}${d} ${d>0?'♥':'▼'}`, d > 0 ? 'up' : 'down');
  if(d > 0) SFX.heart();
}
function flash(type){ const f = $('flash'); f.className = ''; void f.offsetWidth; f.className = type; }
function shakeScreen(){ const g = $('game'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); setTimeout(()=>g.classList.remove('shake'), 600); }

/* ---------------- 배경 ---------------- */
function setBG(key){
  const L = $('bgLayer');
  L.classList.add('fade');
  setTimeout(()=>{ L.innerHTML = sceneSVG(key); L.classList.remove('fade'); }, 250);
}
function petals(kind='petal'){
  const P = $('petals'); P.innerHTML = '';
  const chars = kind === 'leaf' ? ['🍃','🌿','✿'] : kind === 'star' ? ['✦','✧','·'] : ['🌸','❀','✿','🌹'];
  for(let i=0;i<10;i++){
    const p = document.createElement('div'); p.className = 'petal';
    p.textContent = chars[i % chars.length];
    p.style.cssText = `left:${Math.random()*100}%;animation-duration:${12+Math.random()*10}s;animation-delay:${-Math.random()*20}s;font-size:${10+Math.random()*10}px;${kind==='star'?'color:#fff8d0':''}`;
    P.appendChild(p);
  }
  for(let i=0;i<14;i++){
    const s = document.createElement('div'); s.className = 'spark'; const z = 5 + Math.random()*10;
    s.style.cssText = `left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*18}s`;
    P.appendChild(s);
  }
}

/* ---------------- 스프라이트 ---------------- */
const POS = { ll:14, l:28, lc:38, c:50, rc:62, r:72, rr:86 };
const onStage = {};
function show(key, pos='c', mood='normal'){
  let s = onStage[key];
  if(!s){
    const el = document.createElement('div'); el.className = 'sprite enter'; el.dataset.key = key;
    el.innerHTML = '<div class="inner"></div>';
    $('sprites').appendChild(el);
    s = onStage[key] = { el, mood:null };
    setTimeout(()=>el.classList.remove('enter'), 700);
  }
  s.el.style.left = POS[pos] + '%';
  $('sprites').classList.toggle('crowd', Object.keys(onStage).length >= 4);
  if(key === 'owl') s.el.style.height = '52%';
  setMood(key, mood);
}
function setMood(key, mood){
  const s = onStage[key]; if(!s || s.mood === mood) return;
  s.mood = mood;
  s.el.querySelector('.inner').innerHTML = key === 'owl' ? drawOwl(mood) : drawSage(key, mood);
  if(mood === 'serious'){ s.el.classList.remove('shake'); void s.el.offsetWidth; s.el.classList.add('shake'); setTimeout(()=>s.el.classList.remove('shake'), 700); }
  if(mood === 'smile' || mood === 'surprised'){ s.el.classList.remove('hop'); void s.el.offsetWidth; s.el.classList.add('hop'); setTimeout(()=>s.el.classList.remove('hop'), 520); }
}
function hide(key){
  const s = onStage[key]; if(!s) return;
  s.el.classList.add('leave'); delete onStage[key];
  $('sprites').classList.toggle('crowd', Object.keys(onStage).length >= 4);
  setTimeout(()=>s.el.remove(), 450);
}
function clearStage(){ Object.keys(onStage).forEach(hide); }
function focusOn(key){
  Object.entries(onStage).forEach(([k,s])=>s.el.classList.toggle('dim', !!key && k !== key && Object.keys(onStage).length > 1));
}

/* ---------------- 대사 ---------------- */
let typing = null, advance = null;
function fmt(t){ return t.replace(/\{name\}/g, G.name); }
function typeText(text){
  const box = $('dialogText'); box.innerHTML = '';
  $('nextArrow').classList.remove('show');
  const segs = fmt(text).split('**').map((t,i)=>({t, b:i%2===1}));
  return new Promise(res=>{
    const job = { skip:false }; typing = job;
    let si = 0, ci = 0, span = null, cnt = 0;
    const mk = seg => { const e = document.createElement(seg.b ? 'b' : 'span'); box.appendChild(e); return e; };
    const finish = ()=>{ if(typing === job) typing = null; $('dAvatar').classList.remove('talking'); res(); };
    const step = ()=>{
      if(job.cancel) return;
      if(job.skip){
        while(si < segs.length){ if(!span) span = mk(segs[si]); span.textContent += segs[si].t.slice(ci); si++; ci = 0; span = null; }
        finish(); return;
      }
      if(si >= segs.length){ finish(); return; }
      if(!span) span = mk(segs[si]);
      const ch = segs[si].t[ci++];
      if(ch !== undefined){ span.textContent += ch; if(ch !== ' ' && cnt++ % 2 === 0) SFX.blip(); }
      if(ci >= segs[si].t.length){ si++; ci = 0; span = null; }
      setTimeout(step, /[.!?…]/.test(ch) ? 120 : (ch === ',' ? 80 : 26));
    };
    step();
  });
}
function waitClick(){
  $('nextArrow').classList.add('show');
  return new Promise(r=>{ advance = ()=>{ advance = null; $('nextArrow').classList.remove('show'); SFX.page(); r(); }; });
}
function proceed(){
  if(typing){ typing.skip = true; return; }
  if(advance) advance();
}
async function say(who, text, mood){
  $('dialogWrap').classList.remove('hidden');
  const tag = $('nameTag'), dlg = $('dialog'), av = $('dAvatar');
  dlg.classList.toggle('narr', who === 'narr'); tag.classList.toggle('narr', who === 'narr');
  av.classList.add('hidden');
  if(who === 'narr'){ focusOn(null); }
  else if(who === 'me'){
    tag.innerHTML = `${G.name}<small>견습 현자</small>`; tag.style.background = '#c27a8a'; focusOn(null);
  } else {
    const p = PEOPLE[who];
    tag.innerHTML = `${p.name}<small>${p.title}</small>`; tag.style.background = p.color;
    if(onStage[who]){ if(mood) setMood(who, mood); focusOn(who); }
    else { av.classList.remove('hidden'); av.innerHTML = who === 'owl' ? drawOwl(mood || 'normal', {crop:'face'}) : drawSage(who, mood || 'normal', {crop:'face'}); av.classList.add('talking'); focusOn(null); }
  }
  await typeText(text);
  await waitClick();
}
function hideDialog(){ $('dialogWrap').classList.add('hidden'); }

/* ---------------- 선택지 ---------------- */
function choose(opts, q, used=new Set()){
  return new Promise(res=>{
    const L = $('choiceLayer'), list = $('choiceList');
    list.innerHTML = q ? `<div class="choiceQ">${fmt(q)}</div>` : '';
    const keys = ['A','B','C','D'];
    opts.forEach((t,i)=>{
      const b = document.createElement('button'); b.className = 'choice' + (used.has(i) ? ' used' : '');
      b.style.animationDelay = (i*.08) + 's'; b.dataset.i = i;
      b.innerHTML = `<span class="key">${used.has(i) ? '✖' : keys[i]}</span><span class="ct">${fmt(t)}</span>`;
      if(!used.has(i)) b.onclick = ()=>pick(i);
      list.appendChild(b);
    });
    L.classList.remove('hidden');
    const pick = i => {
      if(L.classList.contains('hidden')) return;
      SFX.select();
      list.querySelectorAll('.choice').forEach(b=>{ if(+b.dataset.i === i) b.classList.add('picked'); });
      choose.pick = null;
      setTimeout(()=>{ L.classList.add('hidden'); res(i); }, 360);
    };
    choose.pick = i => { if(i < opts.length && !used.has(i)) pick(i); };
  });
}
/* 정답이 나올 때까지 다시 고르는 딜레마. opts: {t, ok, fn} */
async function dilemma(q, opts){
  const order = opts.map((_,i)=>i).sort(()=>Math.random()-.5);
  const shuffled = order.map(i=>opts[i]);
  const used = new Set(); let first = true;
  while(true){
    const k = await choose(shuffled.map(o=>o.t), q, used);
    const o = shuffled[k];
    if(o.ok){
      if(first && o.bonus !== false) gainStars(50);
      if(o.fn) await o.fn(first);
      return o;
    }
    used.add(k); first = false; G.wrongChoices++;
    loseStars(30); SFX.hit(); flash('red'); shakeScreen();
    if(o.fn) await o.fn();
  }
}

/* ---------------- 오버레이 ---------------- */
function overlay(html, panelCls='panel'){
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="${panelCls}">${html}</div>`;
  $('overlays').appendChild(o); return o;
}
function anyOverlay(){ return $('overlays').children.length > 0 || !$('choiceLayer').classList.contains('hidden'); }

/* ---------------- 파티클 ---------------- */
function burst(x, y, n=30){
  const chars = ['✦','✧','★','✨','⭐','❀'], cols = ['#ffd36e','#ffb3c7','#c9b6ff','#9fe6c8','#ffffff','#ffe9a8'];
  for(let i=0;i<n;i++){
    const p = document.createElement('span'); p.className = 'particle'; p.textContent = chars[Math.random()*chars.length|0];
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*170;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.setProperty('--x', Math.cos(a)*d + 'px'); p.style.setProperty('--y', Math.sin(a)*d - 40 + 'px');
    p.style.setProperty('--r', (Math.random()*720-360) + 'deg'); p.style.setProperty('--s', (10+Math.random()*18) + 'px');
    p.style.setProperty('--c', cols[Math.random()*cols.length|0]); p.style.setProperty('--d', (.8+Math.random()*.8) + 's');
    $('fx').appendChild(p); setTimeout(()=>p.remove(), 1700);
  }
}
function confetti(n=100){
  const cols = ['#f4a9c0','#ffd36e','#b9a6f0','#8fdcbc','#8cc7f0','#ffb38a'];
  for(let i=0;i<n;i++){
    const c = document.createElement('div'); c.className = 'confetti';
    if(i % 6 === 0){ c.textContent = ['✨','🌹','⭐','💖'][i%4]; c.style.fontSize = '18px'; }
    else { c.style.background = cols[i%cols.length]; c.style.width = (6+Math.random()*8)+'px'; c.style.height = (10+Math.random()*10)+'px'; }
    c.style.left = Math.random()*100 + 'vw';
    c.style.setProperty('--dx', (Math.random()*200-100) + 'px'); c.style.setProperty('--rot', (Math.random()*1080-540) + 'deg');
    c.style.animationDuration = (2.6+Math.random()*2.4) + 's'; c.style.animationDelay = Math.random()*1.4 + 's';
    $('fx').appendChild(c); setTimeout(()=>c.remove(), 7000);
  }
}

/* ---------------- 입력 ---------------- */
$('dialog').addEventListener('click', ()=>{ if(!anyOverlay()) proceed(); });
document.addEventListener('keydown', e=>{
  const tag = e.target.tagName;
  if(tag === 'INPUT') return;
  if(!$('choiceLayer').classList.contains('hidden') && choose.pick){
    const m = { a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3 }[e.key.toLowerCase()];
    if(m !== undefined){ choose.pick(m); return; }
  }
  if(e.key === 'Enter' || e.key === ' '){
    if(tag === 'BUTTON') return;
    e.preventDefault();
    if(!$('title').classList.contains('hidden')){ $('startBtn').click(); return; }
    const cc = document.querySelector('.chapterCard'); if(cc){ cc.click(); return; }
    if(!anyOverlay()) proceed();
  }
});
$('soundBtn').onclick = ()=>{ soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; if(soundOn){ initAudio(); SFX.select(); } };

/* =========================================================
   SCENES: 배경 일러스트 (SVG, 1600x900)
   ========================================================= */
function _sky(id, c1, c2, c3){
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset=".6" stop-color="${c2}"/><stop offset="1" stop-color="${c3||c2}"/></linearGradient>
  <radialGradient id="${id}g"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="1600" height="900" fill="url(#${id})"/>`;
}
function _hills(col, y, amp, seed=1){
  let d = `M0 900 L0 ${y}`;
  for(let x=0;x<=1600;x+=200){ const yy = y - Math.abs(Math.sin((x/200+seed)*1.3))*amp; d += ` Q${x+100} ${yy-amp*.4} ${x+200} ${y - Math.abs(Math.sin(((x+200)/200+seed)*1.3))*amp}`; }
  return `<path d="${d} L1600 900Z" fill="${col}"/>`;
}
function _tree(x, y, s, col, trunk='#7a5a44'){

    <circle cx="-14" cy="-92" r="30" fill="#fff" opacity=".14"/></g>`;

function _rays(x, y, col='#fff6d0', op=.35){
  let s = ''; for(let i=0;i<14;i++){ const a = -Math.PI/2 + (i-6.5)*.16; s += `<path d="M${x} ${y} L${x+Math.cos(a-.03)*1400} ${y+Math.sin(a-.03)*1400} L${x+Math.cos(a+.03)*1400} ${y+Math.sin(a+.03)*1400}Z" fill="${col}" opacity="${op*(i%2?.6:1)}"/>`; }
  return s;
}
function _bokeh(n, col='#fff', seed=3){
  let s = ''; for(let i=0;i<n;i++){ const x = (i*373+seed*97)%1600, y = (i*211+seed*53)%700, r = 14 + (i*37)%50; s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity="${.08 + (i%4)*.05}"/>`; }
  return s;
}

/* ---------- 이름 입력 ---------- */
function askName(){
  return new Promise(res=>{
    const o = overlay(`<div class="pTitle">🪶 견습 현자의 이름</div>
      <p class="pSub">현자들이 당신을 부를 이름을 적어 주세요. (최대 8글자)</p>
      <input id="nameInput" maxlength="8" placeholder="루아" autocomplete="off">
      <div class="btnRow"><button class="btn" id="nameOk">이 이름으로 할래요</button></div>`);
    o.querySelector('.panel').style.width = 'min(420px,100%)';
    const inp = o.querySelector('#nameInput');
    setTimeout(()=>inp.focus(), 100);
    const ok = ()=>{ const v = inp.value.trim().replace(/[<>&"']/g,''); G.name = v || '루아'; SFX.chime(); o.remove(); res(); };
    o.querySelector('#nameOk').onclick = ok;
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); ok(); } });
  });
}

/* ---------- 챕터 카드 ---------- */
function chapterCard(no, title, sub, faces){
  return new Promise(res=>{
    hideDialog();
    const c = document.createElement('div'); c.className = 'chapterCard';
    c.innerHTML = `<div class="ccNo">${no}</div><div class="ccTitle">${title}</div><div class="ccSub">${sub}</div>
      <div class="ccFaces">${faces.map(k=>`<div>${drawSage(k,'normal',{crop:'face'})}</div>`).join('')}</div><div class="ccTip">화면을 누르면 계속</div>`;
    $('game').appendChild(c); SFX.chime();
    let done = false;
    const close = ()=>{ if(done) return; done = true; c.remove(); res(); };
    c.onclick = close; setTimeout(close, 4200);
  });
}

/* ---------- 사례 관람 ---------- */
function caseView(id){
  const C = CASES[id];
  return new Promise(res=>{
    hideDialog();
    const items = C.items.map(it => it.box
      ? `<div class="it" style="left:${it.x}%;top:${it.y}%;width:${it.w}%;height:${it.h}%;background:${it.box};border-radius:${it.r||8}px;transform:translate(-50%,-50%);${it.css||''}"></div>`
      : `<div class="it" style="left:${it[1]}%;top:${it[2]}%;font-size:${it[3]}px">${it[0]}</div>`).join('');
    const o = overlay(`
      <div class="caseStage" style="background:${C.bg}">
        ${C.cage ? '<div class="cage"></div>' : ''}${items}
        <span class="lbl">📍 ${C.place}</span>
        ${C.spots.map((s,i)=>`<button class="spot" data-i="${i}" style="left:${s.x}%;top:${s.y}%" title="관찰하기">?</button>`).join('')}
      </div>
      <div class="caseInfo">
        <span class="caseReal">🔎 ${C.real}</span>
        <div class="caseTitle">${C.title}</div>
        <div class="caseDesc">${C.desc}</div>
        <div class="caseCount">✦ 관찰 포인트 <span class="cc">0</span>/${C.spots.length} — 그림 속 <b>?</b>를 눌러 살펴보세요</div>
        <div class="notes">${C.spots.map(()=>`<div class="note ghost">❔ 아직 살펴보지 않았어요</div>`).join('')}</div>
        <div class="btnRow" style="justify-content:flex-end;margin-top:4px"><button class="btn" disabled>📜 기록 완료</button></div>
      </div>`, 'panel casePanel');
    SFX.page();
    let found = 0;
    const notes = o.querySelectorAll('.note'), btn = o.querySelector('.btn');
    o.querySelectorAll('.spot').forEach(sp=>{
      sp.onclick = e=>{
        if(sp.classList.contains('found')) return;
        const i = +sp.dataset.i, s = C.spots[i];
        sp.classList.add('found'); sp.textContent = '✔'; found++;
        notes[found-1].className = 'note'; notes[found-1].innerHTML = `<b>${['①','②','③'][i]} ${s.t}</b><br>${s.n}`;
        o.querySelector('.cc').textContent = found;
        const r = sp.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 14); SFX.select();
        if(found === C.spots.length){ btn.disabled = false; SFX.chime(); }
      };
    });
    btn.onclick = ()=>{ o.remove(); G.cases.add(id); gainStars(30); toast(`📜 도감에 ‘${C.title}’ 기록 추가`, 'star'); res(); };
  });
}

function binFace(b){ return b.face ? drawSage(b.face, 'normal', {crop:'face'}) : b.emoji; }
function sortGame(cfg){
  return new Promise(res=>{
    hideDialog();
    const items = cfg.items.slice().sort(()=>Math.random()-.5);
    let i = 0, correct = 0; const marks = [];
    const o = overlay(`<div class="pTitle">${cfg.title}</div><p class="pSub">${cfg.sub}</p>
      <div class="dots"></div><div class="sortCard"></div><div class="sortWhy"></div>
      <div class="bins">${cfg.bins.map(b=>`<button class="bin" data-b="${b.id}"><span class="bf">${binFace(b)}</span>${b.label}<small>${b.small||''}</small></button>`).join('')}</div>
      <div class="btnRow"><button class="btn hidden" id="sortNext">다음 ▶</button></div>`);
    const card = o.querySelector('.sortCard'), why = o.querySelector('.sortWhy'), dots = o.querySelector('.dots'), next = o.querySelector('#sortNext');
    const bins = [...o.querySelectorAll('.bin')];
    const draw = ()=>{
      dots.innerHTML = items.map((_,k)=>`<i class="${marks[k]||''} ${k===i?'cur':''}"></i>`).join('');
      card.className = 'sortCard'; void card.offsetWidth; card.className = 'sortCard';
      card.textContent = items[i].t; why.innerHTML = '<span style="color:var(--ink-soft)">누구의(어느 입장의) 말일까요? 아래에서 골라 주세요.</span>';
      bins.forEach(b=>b.disabled = false); next.classList.add('hidden');
    };
    bins.forEach(b=>b.onclick = ()=>{
      const it = items[i], ok = b.dataset.b === it.a, bin = cfg.bins.find(x=>x.id === it.a);
      bins.forEach(x=>x.disabled = true);
      if(ok){ correct++; marks[i] = 'ok'; card.classList.add('ok'); SFX.correct(); gainStars(20);
        (bin.sages||[]).forEach(k=>{ G.trust[k] = clamp(G.trust[k]+3,0,100); });
        why.innerHTML = `✔ <b>정답!</b> ${it.why.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}`;
        const r = card.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 18);
      } else { marks[i] = 'no'; card.classList.add('no'); SFX.wrong(); loseStars(20);
        why.innerHTML = `✘ 정답은 <b>${bin.label}</b>! ${it.why.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}`;
      }
      next.classList.remove('hidden'); next.textContent = i === items.length-1 ? '결과 보기 ▶' : '다음 ▶';
      dots.innerHTML = items.map((_,k)=>`<i class="${marks[k]||''} ${k===i?'cur':''}"></i>`).join('');
    });
    next.onclick = ()=>{
      i++;
      if(i < items.length){ draw(); return; }

      const msg = correct === items.length ? '완벽해요! 모든 문장을 정확히 가려냈어요.' : `${items.length}개 중 ${correct}개를 맞혔어요.`;
      toast(`🧩 분류 결과 ${correct}/${items.length}`, 'star');

/* ---------- 교과서 빈칸 시험 ---------- */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const chosung = s => [...s].map(c=>{ const k = c.charCodeAt(0)-0xAC00; return (k<0||k>11171) ? c : CHO[Math.floor(k/588)]; }).join('');
/* 공백 무시: trim() + replace(/\s+/g,'') */
const normalize = v => v.trim().replace(/\s+/g,'').replace(/[()（）\[\]{}'"`.,!?~·]/g,'');
const SUFFIX = ['','과','와','을','를','이','가','은','는','의','로','으로','에','라','이라','이다','입니다','이오'];
const isAns = (v, ans) => ans.some(a => SUFFIX.some(s => v === a + s));
const TIME = 40;

async function trial(cfg){
  G.hp = 3; renderHearts(); toast('❤️ 도덕 멘탈이 가득 찼어요!', 'up');
  let mistakes = 0;
  for(let q = 0; q < cfg.qs.length; ){
    const r = await trialQ(cfg, q);
    if(r.ok){ mistakes += r.wrong; q++; }
    else { mistakes += r.wrong; await gameOver(cfg, r.reason); G.hp = 3; G.revives++; renderHearts(); }
  }
  if(mistakes === 0 && cfg.sages.length){ cfg.sages.forEach(k=>trust(k, 10)); }
  return mistakes;
}
function trialQ(cfg, qi){
  const Q = cfg.qs[qi];
  return new Promise(res=>{
    hideDialog();
    const o = overlay(`
      <div class="tLeft"><div class="tFace">${drawSage(cfg.sage, 'normal', {crop:'face'})}</div>
        <div><div class="tName">${PEOPLE[cfg.sage].name}의 시험</div><div class="tBook">📖 ${cfg.page}<br>빈칸에 들어갈 말을 교과서에서 찾아 그대로 써 보세요.</div></div></div>
      <div class="tRight">
        <div class="tHead"><span class="tQno">${cfg.title} · ${qi+1}/${cfg.qs.length}</span>
          <div class="tTimer">⏳<div class="tTrack"><div class="tFill"></div></div><span class="tSec">${TIME}초</span></div></div>
        <div class="tSentence">${Q.pre}<span class="blank"><input id="answerInput" maxlength="16" autocomplete="off" spellcheck="false" placeholder="정답 입력"><button class="okBtn">확인</button></span>${Q.post}</div>
        <div class="tClue">📖 <b>단서</b> · ${Q.clue}</div>
        <div class="tHintBox"></div>
        <div class="tFoot"><span>띄어쓰기는 상관없어요 · Enter로 제출</span><span>틀리면 ❤️ -1 · 시간이 다 되면 게임 오버</span></div>
      </div>`, 'panel trialPanel');
    const inp = o.querySelector('#answerInput'), fill = o.querySelector('.tFill'), sec = o.querySelector('.tSec'), hintBox = o.querySelector('.tHintBox');
    setTimeout(()=>inp.focus(), 150);
    let t = TIME, wrong = 0, done = false;
    const timer = setInterval(()=>{
      if(done) return;
      const prev = t; t = Math.max(0, t - .1);
      fill.style.width = (t/TIME*100) + '%';
      sec.textContent = Math.ceil(t) + '초';
      fill.classList.toggle('warn', t <= 20 && t > 10); fill.classList.toggle('danger', t <= 10); sec.classList.toggle('danger', t <= 10);
      if(Math.ceil(t) !== Math.ceil(prev) && t <= 5 && t > 0) SFX.tick();
      if(t <= 0){ end({ ok:false, reason:'time', wrong }); }
    }, 100);
    const end = r => { if(done) return; done = true; clearInterval(timer); setTimeout(()=>{ o.remove(); res(r); }, r.ok ? 900 : 500); };
    const submit = ()=>{
      if(done) return;
      const v = normalize(inp.value);
      if(!v){ inp.classList.remove('wrong'); void inp.offsetWidth; inp.classList.add('wrong'); inp.focus(); return; }
      if(isAns(v, Q.ans)){
        inp.classList.add('correct'); inp.disabled = true; SFX.correct();
        const r = inp.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 36);
        const bonus = Math.ceil(t) * 2; gainStars((wrong ? 50 : 100) + bonus);
        end({ ok:true, wrong });
      } else {
        wrong++; G.wrongQuiz++; SFX.wrong(); flash('red');
        inp.classList.remove('wrong'); void inp.offsetWidth; inp.classList.add('wrong');
        damage();
        if(G.hp <= 0){ end({ ok:false, reason:'hp', wrong }); return; }
        const words = Q.hint.split(' ');
        const code = wrong <= 1 ? words.map(chosung).join(' ') : words.map(w=>w[0] + chosung(w.slice(1))).join(' ');
        hintBox.innerHTML = `<div class="tHint">❌ ${wrong <= 1 ? '아쉬워요! 초성을 보고 다시 찾아보세요.' : '이번엔 첫 글자까지 알려 줄게요!'} <b>💡 초성 힌트</b><span class="hintCode">${code}</span></div>`;
        inp.value = ''; inp.focus();
      }
    };
    o.querySelector('.okBtn').onclick = submit;
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); submit(); } });
  });
}

/* ---------- 지도 ---------- */
function nodeState(id){
  const n = NODES[id];
  if(G.done.has(id)) return 'done';
  if(n.ch > G.chapter) return 'locked';
  if(n.ch < G.chapter) return 'done';
  if(n.boss){ const rest = Object.entries(NODES).filter(([k,v])=>v.ch === n.ch && !v.boss); if(rest.some(([k])=>!G.done.has(k))) return 'locked'; }
  return 'avail';
}
function mapView(objective){
  return new Promise(res=>{

      ${Object.entries(NODES).map(([id,n])=>{ const st = nodeState(id); return `<button class="node ${st} ${n.boss?'boss':''}" data-id="${id}" style="left:${n.x}%;top:${n.y}%"><span class="nIco">${n.i}</span><span class="nLbl">${n.n}</span></button>`; }).join('')}
      <div id="token" style="left:${NODES[G.pos].x}%;top:${NODES[G.pos].y}%">${drawOwl('normal')}</div></div>`;
    $('game').appendChild(L); SFX.page();
    let moving = false;
    L.querySelectorAll('.node').forEach(b=>b.onclick = ()=>{
      if(moving) return;
      const id = b.dataset.id, st = nodeState(id);
      if(st === 'locked'){
        const n = NODES[id];
        toast(n.ch > G.chapter ? '🔒 아직 갈 수 없는 지역이에요.' : '🔒 이 지역의 사연을 모두 관람하면 열려요!', 'down'); SFX.wrong(); return;

      setTimeout(()=>{ G.pos = id; L.remove(); res(id); }, 1100);

  });
}

/* ---------------- 챕터 공통 루프 ---------------- */
async function chapterLoop(ch, objective, bossObjective){
  while(true){
    const rest = Object.entries(NODES).filter(([k,v])=>v.ch === ch && !v.boss);
    const left = rest.filter(([k])=>!G.done.has(k)).length;
    const id = await mapView(left ? `${objective} (남은 사연 ${left}개)` : bossObjective);
    await NODE_RUN[id]();
    G.done.add(id);
    if(NODES[id].boss) return;
  }
}

    '지인: 대지는 모든 존재가 그물망처럼 얽힌 생명 공동체야. 자연 그 자체를 존중해야 해.'
  ], '나는 누구의 입장에 동의하나요? (교과서 175쪽)');
  if(k === 0){ G.stance = 'animal'; trust('singer', 8); trust('regan', 8); await S('singer','동물의 고통을 외면하지 않는 마음이오. 그 마음으로 길고양이와 실험실의 토끼를 기억해 주시오.','smile'); }
  if(k === 1){ G.stance = 'life'; trust('schweitzer', 8); trust('taylor', 8); await S('schweitzer','길가의 작은 꽃 한 송이까지… 그 마음이면 충분해요.','smile'); }
  if(k === 2){ G.stance = 'eco'; trust('leopold', 12); await S('leopold','산처럼 생각하는 현자가 하나 더 늘었군.','smile'); }
  await S('owl', '어떤 입장을 골랐든, 중요한 건 그 입장의 좋은 점을 **실제 삶의 문제**와 연결해 실천하는 거예요. (175쪽 활동 2번도 해 보세요!)', 'smile');
  /* 가장 신뢰도가 높은 현자의 특별 장면 */
  const fav = SAGE_KEYS.slice().sort((a,b)=>G.trust[b]-G.trust[a])[0];
  clearStage(); hideDialog(); await sleep(500); flash('white'); SFX.chime();
  setBG(fav === 'leopold' ? 'summit' : fav === 'singer' ? 'training' : fav === 'regan' ? 'training' : 'chapel');
  show(fav, 'c', 'smile');
  await S('narr', `모두가 떠난 뒤, ${PEOPLE[fav].name}이(가) 조용히 {name}에게 다가왔다.`);
  await S(fav, FAV_LINES[fav], 'smile');
  await S('me', '(…이 여정을 오래도록 잊지 못할 것 같아.)');
  hideDialog();
  showEnding(fav);
}
const FAV_LINES = {
  singer:'{name}, 그대에게 기사단의 푸른 망토를 주겠소. 고통받는 존재 앞에서 결코 눈을 돌리지 않는 기사가 되어 주시오. …그리고 가끔은 훈련장에 들러 주시오.',
  regan:'{name}, 근위대의 문장을 받으시오. 그대는 약한 존재의 권리를 지키는 방패가 될 것이오. 그대가 내 동료라는 게 자랑스럽소.',
  schweitzer:'{name} 님, 내 병원의 문은 언제나 열려 있어요. 살고자 하는 모든 생명을, 앞으로도 함께 돌봐 주겠어요?',
  taylor:'{name}, 내 연구실의 두 번째 열쇠요. 모든 생명이 지닌 고유한 가치를… 앞으로도 그대와 함께 증명하고 싶소.',
  leopold:'{name}, 내 쌍안경을 그대에게 주겠소. 이제 그대도 산처럼 생각하는 법을 아니까. 다음 계절에도 이 고원을 함께 걸어 주시오.'
};

/* ================= MAIN ================= */
(async function main(){
  renderHearts(); bumpStar();
  await titleScreen();
  /* 숨은 바로가기: 주소 끝에 #ch2, #ch3, #finale 을 붙이면 해당 장부터 시작 */
  const jump = { '#ch2':2, '#ch3':3, '#finale':4 }[location.hash] || 0;
  if(jump){
    $('hud').classList.remove('hidden'); renderHearts();
    for(const [id,n] of Object.entries(NODES)) if(n.ch < jump) G.done.add(id);
    if(jump > 2) G.notes.add('n1'); if(jump > 3){ G.notes.add('n2'); G.notes.add('n3'); }
  } else { await prologue(); await chapter1(); }
  if(jump <= 2) await chapter2();
  if(jump <= 3) await chapter3();
  await finale();
})();

</script>
